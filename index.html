<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#04110d">
<title>HZV AI Studio — ontwerpvoorstel (preview)</title>
<meta name="description" content="Ontwerpvoorstel voor de HZV AI Studio van Huis Zelfverkoop: woningfoto's, virtuele styling, rondleidingvideo, plattegrond, advertentietekst en social-clips. Demo.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="nebula" aria-hidden="true"></canvas>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Hoofdnavigatie"></aside>
  <div class="main">
    <header class="topbar">
      <a class="brand" href="#/studio" aria-label="HZV AI Studio — start">
        <svg viewBox="0 0 100 100" class="logo" aria-hidden="true"><polygon points="8,46 50,10 92,46" fill="#f7a100"/><rect x="20" y="44" width="60" height="46" fill="#0071b3"/><rect x="42" y="64" width="16" height="26" fill="#fff"/></svg>
        <span class="brand__txt"><b>Huis Zelfverkoop</b><small>HZV AI STUDIO</small></span>
      </a>
      <button class="proj-chip" id="projChip" type="button" aria-haspopup="dialog"><span class="dot"></span><span id="projChipName">Voorbeeldwoning</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="icon-btn" id="keyBtn" type="button" aria-label="AI-provider koppelen"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 12l8-8m-3 3l2 2m-4 0l2 2" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </header>
    <div class="demo-ribbon" role="note"><span class="pulse"></span>ONTWERPVOORSTEL · DEMO — er wordt niets echt gegenereerd, verstuurd of opgeslagen</div>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">
      <p>HZV AI Studio is een onderdeel van <a href="https://www.huiszelfverkoop.nl" rel="noopener" target="_blank">huiszelfverkoop.nl</a> · Voorbeeldwoning en beelden zijn demo-materiaal.</p>
      <p class="credit">Ontwerpvoorstel door FilmForge · <a href="https://www.filmforge.nl" target="_blank" rel="noopener">www.filmforge.nl</a></p>
    </footer>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Navigatie"></nav>
</div>
<div class="fab-wrap"><button class="fab" id="fab" type="button" aria-label="Nieuwe woning starten"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" fill="none"/></svg><span>Nieuwe woning</span></button></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
